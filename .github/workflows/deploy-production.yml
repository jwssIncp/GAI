name: Deploy Production

# Auto-deploy on push to main is disabled until AWS OIDC/secrets are ready.
# Re-enable with:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    needs: [quality]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: gai-backend
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build --target production \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:production" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:production"
          docker push "$IMAGE:latest"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_DEFINITION }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: gai-backend
          image: ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register task definition
        id: register
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          ) | with_entries(select(.value != null))' \
            "${{ steps.render.outputs.task-definition }}" > task-definition-clean.json
          REV=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-clean.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_definition_arn=$REV" >> "$GITHUB_OUTPUT"
          echo "Registered $REV"

      - name: Run database migrations
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_TASK_DEFINITION: ${{ steps.register.outputs.task_definition_arn }}
          ECS_SUBNETS: ${{ secrets.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ secrets.ECS_SECURITY_GROUPS }}
        run: bash .github/scripts/ecs-run-migrations.sh

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --task-definition "${{ steps.register.outputs.task_definition_arn }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gai-frontend/package-lock.json

      - name: Build frontend
        working-directory: gai-frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Sync frontend to S3
        run: |
          aws s3 sync gai-frontend/dist/ "s3://${{ secrets.FRONTEND_S3_BUCKET }}/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp gai-frontend/dist/index.html "s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
