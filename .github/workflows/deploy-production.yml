name: Deploy Production

# Auto-deploy on push to main is disabled until AWS OIDC/secrets are ready.
# Re-enable with:
#   push:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APLICAR to release (verified RDS snapshot, then DB migrations, then ECS update)
        type: string
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    needs: [quality]
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: production
      release_confirmation: ${{ inputs.confirm }}
    secrets: inherit
