name: Deploy Production

# Auto-deploy on push to main is disabled until AWS OIDC/secrets are ready.
# Re-enable with:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy production
    needs: [quality]
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: production
    secrets: inherit
