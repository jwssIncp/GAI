name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · audit · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gai-backend/package-lock.json
      - run: npm ci
      - run: node --test ../.github/scripts/prepare-document-task.test.cjs ../.github/scripts/ci-s3.test.cjs ../.github/scripts/deploy-safety.test.cjs ../scripts/runtime-credentials.test.cjs
      - run: npm run lint
      - run: npm audit --audit-level=high || true
      - run: npm run test:cov
      - run: npm run build

  frontend:
    name: Frontend (lint · audit · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gai-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high || true
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  integration:
    name: Backend integration (disposable MySQL and S3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gai-backend
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: gai-validation-only
          MYSQL_DATABASE: gai_validation_disposable
        ports:
          - 33337:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgai-validation-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gai-backend/package-lock.json
      - run: npm ci
      - name: Start disposable S3-compatible service
        timeout-minutes: 5
        run: node ../.github/scripts/ci-s3.cjs start
      - run: npm run test:integration:mysql
        timeout-minutes: 40
      - name: Release/retention MySQL lock
        run: node --test scripts/with-db-lock.test.cjs
        env:
          GAI_TEST_MYSQL_DISPOSABLE: '1'
        timeout-minutes: 5
      - run: npm run test:integration:s3
        timeout-minutes: 10
      - name: Diagnose isolated storage failure
        if: ${{ failure() }}
        timeout-minutes: 1
        run: node ../.github/scripts/ci-s3.cjs diagnostics
      - name: Remove disposable storage
        if: ${{ always() }}
        timeout-minutes: 1
        run: node ../.github/scripts/ci-s3.cjs cleanup
