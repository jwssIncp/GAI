name: Infra (Terraform)

# PR touching infra  -> plan for homolog and production (read-only role, no secret access,
#                       -refresh=false: shows config changes, not drift), summary in the run.
# Push to develop    -> apply homolog (environment infra-homolog).
# Manual dispatch    -> plan only by default; tick "apply" to apply. Production is
#                       manual-only and must be dispatched from the default branch.
on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [develop]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [homolog, production]
        default: homolog
      apply:
        description: Apply the plan (unchecked = plan only)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

defaults:
  run:
    working-directory: infra/terraform

jobs:
  plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [homolog, production]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || 'latest' }}
          terraform_wrapper: false

      - name: Configure AWS (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check (non-blocking)
        run: terraform fmt -check -recursive
        continue-on-error: true
      - run: terraform init -backend-config=env/${{ matrix.environment }}.backend.hcl
      - run: terraform validate

      - name: Plan
        run: |
          set -o pipefail
          terraform plan -lock=false -refresh=false -no-color \
            -var-file=env/${{ matrix.environment }}.tfvars | tee plan.txt
          {
            echo "### Terraform plan - ${{ matrix.environment }}"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: ${{ (github.event_name == 'push' || inputs.apply) && 'Apply' || 'Plan' }} (${{ inputs.environment || 'homolog' }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: infra-${{ inputs.environment || 'homolog' }}
    concurrency:
      group: terraform-${{ inputs.environment || 'homolog' }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.environment || 'homolog' }}
      DO_APPLY: ${{ github.event_name == 'push' || inputs.apply }}
    steps:
      - name: Guard production ref
        if: env.TARGET_ENV == 'production' && github.ref_name != github.event.repository.default_branch
        working-directory: .
        run: |
          echo "::error::Production must be dispatched from ${{ github.event.repository.default_branch }} (got ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || 'latest' }}
          terraform_wrapper: false

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -backend-config=env/${TARGET_ENV}.backend.hcl
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -no-color -var-file=env/${TARGET_ENV}.tfvars -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan - ${TARGET_ENV} (apply: ${DO_APPLY})"
            echo '```'
            grep -E '^(Plan:|No changes|  # )' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: env.DO_APPLY == 'true'
        run: terraform apply -no-color tfplan
