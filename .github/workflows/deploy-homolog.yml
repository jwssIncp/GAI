name: Deploy Homolog

# Auto-deploy on push to develop is disabled until AWS OIDC/secrets are ready.
# Re-enable with:
#   push:
#     branches: [develop]
on:
  workflow_dispatch:

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy homolog
    needs: [quality]
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: homolog
    secrets: inherit
