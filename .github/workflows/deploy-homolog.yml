name: Deploy Homolog

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APLICAR to release (verified RDS snapshot, then DB migrations, then ECS update)
        type: string
        required: true

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy homolog
    needs: [quality]
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: homolog
      release_confirmation: ${{ inputs.confirm }}
    secrets: inherit
