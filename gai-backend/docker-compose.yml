services:
  mysql:
    image: mysql:8.0
    container_name: gai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gai
      MYSQL_USER: gai
      MYSQL_PASSWORD: gai
    ports:
      - '3306:3306'
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - gai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: dev
    container_name: gai-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      NODE_ENV: local
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  gai_mysql_data:
