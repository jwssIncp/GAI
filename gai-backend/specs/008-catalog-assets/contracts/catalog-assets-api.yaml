openapi: 3.1.0
info:
  title: GAI Backend - Catalog Assets API
  version: 1.0.0
  description: |
    Catalogo padronizado de ativos por organization.

servers:
  - url: http://localhost:3000/api/v1
  - url: /api/v1

tags:
  - name: Catalog Assets
    description: Catalogo de ativos por organization

paths:
  /catalog-assets:
    post:
      tags: [Catalog Assets]
      summary: Criar catalog asset
      operationId: createCatalogAsset
      description: Requer `catalog-assets:create`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogAssetRequest'
      responses:
        '201': { $ref: '#/components/responses/CatalogAssetOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Catalog Assets]
      summary: Listar catalog assets (paginado)
      operationId: listCatalogAssets
      description: Requer `catalog-assets:read`; usuarios de organization recebem somente a propria organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: organization_id
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CatalogAssetStatus' }
        - name: category
          in: query
          schema: { type: string, maxLength: 100 }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAssetListResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /catalog-assets/{id}:
    parameters:
      - $ref: '#/components/parameters/CatalogAssetId'
    get:
      tags: [Catalog Assets]
      summary: Consultar catalog asset
      operationId: getCatalogAsset
      description: Requer `catalog-assets:read`.
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/CatalogAssetOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Catalog Assets]
      summary: Atualizar catalog asset
      operationId: updateCatalogAsset
      description: Requer `catalog-assets:update`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogAssetRequest'
      responses:
        '200': { $ref: '#/components/responses/CatalogAssetOk' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /catalog-assets/{id}/deactivate:
    post:
      tags: [Catalog Assets]
      summary: Desativar catalog asset
      operationId: deactivateCatalogAsset
      description: Requer `catalog-assets:deactivate`.
      parameters:
        - $ref: '#/components/parameters/CatalogAssetId'
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/CatalogAssetOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /catalog-assets/{id}/reactivate:
    post:
      tags: [Catalog Assets]
      summary: Reativar catalog asset
      operationId: reactivateCatalogAsset
      description: Requer `catalog-assets:reactivate`.
      parameters:
        - $ref: '#/components/parameters/CatalogAssetId'
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/CatalogAssetOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
  parameters:
    CatalogAssetId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INTERNAL_ERROR] }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    CatalogAssetStatus:
      type: string
      enum: [active, inactive]
    CreateCatalogAssetRequest:
      type: object
      required: [organization_id, description]
      properties:
        organization_id: { type: integer, format: int64, minimum: 1 }
        description: { type: string, minLength: 1, maxLength: 255 }
        category: { type: string, maxLength: 100, nullable: true }
        metadata: { type: object, nullable: true }
    UpdateCatalogAssetRequest:
      type: object
      properties:
        description: { type: string, minLength: 1, maxLength: 255 }
        category: { type: string, maxLength: 100, nullable: true }
        metadata: { type: object, nullable: true }
    CatalogAssetResponse:
      type: object
      required: [id, organization_id, description, description_normalized, status, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        organization_id: { type: integer, format: int64 }
        description: { type: string }
        description_normalized: { type: string }
        category: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CatalogAssetStatus' }
        metadata: { type: object, nullable: true }
        created_by_id: { type: integer, format: int64, nullable: true }
        updated_by_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    CatalogAssetListResponse:
      type: object
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogAssetResponse' }
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
  responses:
    CatalogAssetOk:
      description: Catalog asset retornado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CatalogAssetResponse' }
    Unauthorized:
      description: Token ausente ou invalido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Autenticado sem permissao suficiente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Registro nao encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Dados invalidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflito de negocio ou escopo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
